<!DOCTYPE html>
<html lang="zh-CN">
<head> 
    <!--以下源码与文件夹内图片素材为 QQ@加油鸭（2167423447）授权给特威用于鹅仔（Scooty Penguin）的购物网页所用，未经允许不可删除该文本与用于其他项目！-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Scooty Penguin · 首页</title>

    <style>
        /* ============================================================
                   本地字体
                   ============================================================ */
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 200;
            font-display: swap;
        }
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 300;
            font-display: swap;
        }
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }
        @font-face {
            font-family: 'MyFont';
            src: url('fonts/SC.ttf') format('truetype');
            font-weight: 800;
            font-display: swap;
        }

        /* ============================================================
                   全局变量 — 固定浅色模式
                   ============================================================ */
        :root {
            --color-bg: #ffffff;
            --color-bg-alt: #f5f5f7;
            --color-text: #1d1d1f;
            --color-text-secondary: #6e6e73;
            --color-text-tertiary: #a1a1a6;
            --color-border: rgba(0, 0, 0, 0.04);
            --color-border-strong: rgba(0, 0, 0, 0.10);
            --color-nav-bg: rgba(255, 255, 255, 0.78);
            --color-accent: #0071e3;
            --color-accent-hover: #0077ed;
            --color-divider: rgba(0, 0, 0, 0.05);
            --font: 'MyFont', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --color-btn-text: #ffffff;

            --title-size: 24px;
            --sub-size: 14px;
            --btn-font-size: 12px;
            --btn-padding: 6px 18px;
            --hero-padding-top: 60px;
        }

        /* ============================================================
                   Reset
                   ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color-scheme: light;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.4;
            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-text-tertiary);
            border-radius: 20px;
        }

        img {
            max-width: 100%;
            display: block;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================================
                   导航栏 — 桌面端
                   ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            background: transparent;
            transition: background 0.5s ease, backdrop-filter 0.5s ease;
        }

        .navbar.scrolled {
            background: var(--color-nav-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: clamp(14px, 1.5vw, 24px);
            list-style: none;
            font-size: clamp(10px, 1vw, 13px);
            font-weight: 400;
            letter-spacing: 0.2px;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            transition: color 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 2px;
            color: #000000;
            font-size: inherit;
        }
        .nav-links a:hover {
            color: #000000;
        }

        .nav-links .logo-img {
            height: 22px;
            width: auto;
            max-width: 100px;
            display: block;
            flex-shrink: 0;
        }

        .nav-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .nav-icon img {
            height: 1em;
            width: auto;
            display: block;
            vertical-align: middle;
        }

        /* ============================================================
                   移动端：搜索 + 购物袋（在导航栏内）
                   ============================================================ */
        .nav-actions {
            display: none;
            align-items: center;
            gap: 10px;
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1002;
        }

        .nav-actions .action-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            transition: opacity 0.3s ease;
            padding: 4px;
        }
        .nav-actions .action-link:hover {
            opacity: 0.6;
        }
        .nav-actions .action-link img {
            height: 18px;
            width: auto;
            display: block;
        }

        /* ============================================================
                   独立汉堡按钮 — 固定定位，极高层级，确保不被遮挡
                   ============================================================ */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 4px;
            position: fixed;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            transition: none;
        }
        .menu-toggle span {
            display: block;
            width: 20px;
            height: 1.8px;
            background: #000000;
            border-radius: 2px;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-origin: center;
        }
        /* 修复：两条线需各自向中心位移，才会收成一个标准的「X」 */
        .menu-toggle.active span:first-child {
            transform: translateY(3.4px) rotate(45deg);
        }
        .menu-toggle.active span:last-child {
            transform: translateY(-3.4px) rotate(-45deg);
        }

        /* ============================================================
                   全屏菜单（移动端）
                   ============================================================ */
        .fullscreen-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 80px 32px 40px 48px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        visibility 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .fullscreen-menu.open {
            opacity: 1;
            visibility: visible;
        }

        .fullscreen-menu .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(20px, 2.5vw, 40px);
            padding: 0;
            margin: 0;
            width: 100%;
        }

        .fullscreen-menu .menu-list li {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .fullscreen-menu.open .menu-list li {
            opacity: 1;
            transform: translateY(0);
        }

        .fullscreen-menu.open .menu-list li:nth-child(1) { transition-delay: 0.05s; }
        .fullscreen-menu.open .menu-list li:nth-child(2) { transition-delay: 0.10s; }
        .fullscreen-menu.open .menu-list li:nth-child(3) { transition-delay: 0.15s; }
        .fullscreen-menu.open .menu-list li:nth-child(4) { transition-delay: 0.20s; }

        .fullscreen-menu .menu-list a {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
            padding: 4px 0;
            position: relative;
            display: inline-block;
        }

        .fullscreen-menu .menu-list a:hover {
            color: #000000;
        }

        /* ============================================================
                   桌面端：隐藏移动端元素
                   ============================================================ */
        @media (min-width: 769px) {
            .nav-actions {
                display: none !important;
            }
            .menu-toggle {
                display: none !important;
            }
            .fullscreen-menu {
                display: none !important;
            }
        }

        /* ============================================================
                   移动端适配
                   ============================================================ */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 20px;
                height: 48px;
                justify-content: flex-start;
            }

            .nav-links .logo-img {
                height: 18px;
                max-width: 80px;
            }

            .nav-links li:not(:first-child) {
                display: none;
            }

            .nav-actions {
                display: flex;
                right: 80px;
                gap: 8px;
            }
            .nav-actions .action-link img {
                height: 18px;
            }

            .menu-toggle {
                display: flex;
                right: 50px;
                padding: 4px;
                top: 24px;
                transform: translateY(-50%);
            }
            .menu-toggle span {
                width: 18px;
                height: 1.6px;
            }

            .fullscreen-menu {
                padding: 80px 28px 40px 40px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 16px;
                height: 44px;
            }
            .nav-links .logo-img {
                height: 16px;
                max-width: 70px;
            }
            .nav-actions {
                right: 72px;
                gap: 6px;
            }
            .nav-actions .action-link img {
                height: 16px;
            }
            .menu-toggle {
                right: 44px;
                top: 22px;
            }
            .menu-toggle span {
                width: 16px;
                height: 1.5px;
            }
            .fullscreen-menu {
                padding: 72px 20px 32px 32px;
            }
            .fullscreen-menu .menu-list a {
                font-size: clamp(24px, 4.5vw, 32px);
            }
            .fullscreen-menu .menu-list {
                gap: clamp(18px, 2.5vw, 32px);
            }
        }

        /* ============================================================
                   以下为原有其他样式（英雄区、产品、Footer等）
                   ============================================================ */
        .hero {
            position: relative;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: var(--hero-padding-top) 24px 30px;
            overflow: hidden;
            background: var(--color-bg);
            transition: padding 0.25s ease;
        }

        .hero-bg-wrapper {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
        }

        .hero-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .hero-bg-img.loaded {
            opacity: 1;
        }

        .hero-bg-web {
            display: block;
        }
        .hero-bg-mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .hero-bg-web {
                display: none;
            }
            .hero-bg-mobile {
                display: block;
            }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .hero h1 {
            font-size: var(--title-size);
            font-weight: 600;
            letter-spacing: -1px;
            line-height: 1.05;
            color: #000000 !important;
            animation: fadeUp 0.9s 0.2s both;
            transition: font-size 0.25s ease;
        }

        .hero .sub {
            font-size: var(--sub-size);
            font-weight: 400;
            color: var(--color-text-secondary);
            letter-spacing: 0.2px;
            margin-top: 2px;
            animation: fadeUp 0.9s 0.3s both;
            transition: font-size 0.25s ease;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 0.8vw, 10px);
            flex-wrap: wrap;
            margin-top: clamp(6px, 1vw, 12px);
            animation: fadeUp 0.9s 0.4s both;
        }

        .btn-solid {
            background: var(--color-accent);
            color: #ffffff;
            font-weight: 500;
            font-size: var(--btn-font-size);
            padding: var(--btn-padding);
            border-radius: 980px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, font-size 0.25s ease, padding 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-solid:hover {
            background: var(--color-accent-hover);
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: var(--color-accent);
            font-weight: 500;
            font-size: var(--btn-font-size);
            padding: var(--btn-padding);
            border-radius: 980px;
            border: 1px solid var(--color-accent);
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease, font-size 0.25s ease, padding 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-outline:hover {
            background: var(--color-accent);
            color: #ffffff;
            transform: scale(1.02);
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            color: var(--color-text-tertiary);
            font-size: clamp(8px, 0.8vw, 11px);
            letter-spacing: 1.5px;
            opacity: 0.3;
            animation: bounceDown 3s ease-in-out infinite;
            display: flex;
            flex-direction: column;/*---锦程---*/
            align-items: center;
            gap: 4px;
        }
        .scroll-hint .line {
            width: 1px;
            height: clamp(16px, 2vw, 24px);
            background: var(--color-text-tertiary);
        }

        .section-spacer {
            height: clamp(16px, 3vw, 32px);
            background: var(--color-bg);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--color-divider);
            border: none;
        }

        .products-section {
            padding: 0;
            background: var(--color-bg);
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            width: 100%;
        }

        .product-card {
            position: relative;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: hidden;
            background: var(--color-bg-alt);
            border-bottom: 1px solid var(--color-divider);
            padding: clamp(20px, 3vw, 36px) 20px 20px;
        }
        .product-card:nth-child(1) {
            border-right: 1px solid var(--color-divider);
        }
        .product-card:nth-child(3) {
            border-right: 1px solid var(--color-divider);
        }

        .product-card .card-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .product-card .card-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.7;
            transition: opacity 0.8s ease, transform 0.6s ease;
        }
        .product-card .card-bg img.loaded {
            opacity: 1;
        }

        .product-card .card-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 16px;
            max-width: 280px;
            width: 100%;
        }

        .product-card .card-content h3 {
            font-size: var(--title-size);
            font-weight: 600;
            letter-spacing: -1px;
            line-height: 1.05;
            transition: font-size 0.25s ease;
        }

        .product-card .card-content .sub {
            font-size: var(--sub-size);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.2px;
            transition: font-size 0.25s ease;
        }

        .product-card .card-content .btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 0.8vw, 10px);
            flex-wrap: wrap;
            margin-top: clamp(6px, 1vw, 12px);
        }

        .product-card .card-content .btn-solid-sm {
            background: var(--color-accent);
            color: #ffffff;
            font-weight: 500;
            font-size: var(--btn-font-size);
            padding: var(--btn-padding);
            border-radius: 980px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, font-size 0.25s ease, padding 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .product-card .card-content .btn-solid-sm:hover {
            background: var(--color-accent-hover);
            transform: scale(1.02);
        }

        .product-card .card-content .btn-outline-sm {
            background: transparent;
            color: var(--color-accent);
            font-weight: 500;
            font-size: var(--btn-font-size);
            padding: var(--btn-padding);
            border-radius: 980px;
            border: 1px solid var(--color-accent);
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease, font-size 0.25s ease, padding 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .product-card .card-content .btn-outline-sm:hover {
            background: var(--color-accent);
            color: #ffffff;
            transform: scale(1.02);
        }

        /* 深色底图：白色文字 + 玻璃质感按钮 */
        .product-card.light-text .card-content h3 {
            color: #ffffff;
        }
        .product-card.light-text .card-content .sub {
            color: #ffffff;
        }
        .product-card.light-text .card-content .btn-solid-sm {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .product-card.light-text .card-content .btn-solid-sm:hover {
            background: rgba(255, 255, 255, 0.32);
        }
        .product-card.light-text .card-content .btn-outline-sm {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.50);
        }
        .product-card.light-text .card-content .btn-outline-sm:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* 浅色底图：深色文字 + 蓝色按钮 */
        .product-card.dark-text .card-content h3 {
            color: #1d1d1f;
        }
        .product-card.dark-text .card-content .sub {
            color: #1d1d1f;
        }
        .product-card.dark-text .card-content .btn-solid-sm {
            color: #ffffff;
            background: var(--color-accent);
        }
        .product-card.dark-text .card-content .btn-solid-sm:hover {
            background: var(--color-accent-hover);
        }
        .product-card.dark-text .card-content .btn-outline-sm {
            color: var(--color-accent);
            border-color: var(--color-accent);
        }
        .product-card.dark-text .card-content .btn-outline-sm:hover {
            background: var(--color-accent);
            color: #ffffff;
        }

        .footer {
            background: var(--color-bg-alt);
            border-top: 1px solid var(--color-divider);
            padding: 32px 0 24px;
            font-size: clamp(10px, 0.8vw, 13px);
            color: var(--color-text-tertiary);
        }
        .footer-grid {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .footer-links {
            display: flex;
            gap: clamp(12px, 2vw, 24px);
            flex-wrap: wrap;
        }
        .footer-links a {
            transition: color 0.3s ease;
        }
        .footer-links a:hover {
            color: var(--color-text);
        }
        .footer .brand {
            font-weight: 500;
            color: var(--color-text);
            letter-spacing: -0.3px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceDown {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(6px);
            }
        }

        @media (max-width: 1100px) and (min-width: 769px) {
            .hero {
                padding-top: calc(var(--hero-padding-top) + 16px);
            }
            .hero h1 {
                font-size: clamp(20px, 2.8vw, 28px);
                letter-spacing: -0.8px;
            }
            .hero .sub {
                font-size: clamp(12px, 1.4vw, 16px);
                margin-top: 1px;
            }
            .hero-actions {
                gap: clamp(4px, 0.8vw, 8px);
                margin-top: clamp(4px, 0.8vw, 10px);
            }
            .btn-solid,
            .btn-outline {

    <!-- ============================================================

    <script>
        (function() {
            'use strict';

            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', function() {
                const scrollY = window.pageYOffset || document.documentElement.scrollTop;
                navbar.classList.toggle('scrolled', scrollY > 30);
            }, { passive: true });

            const toggle = document.getElementById('menuToggle');
            const menu = document.getElementById('fullscreenMenu');
            const body = document.body;

            function openMenu() {
                toggle.classList.add('active');
                menu.classList.add('open');
                body.classList.add('menu-open');
            }

            function closeMenu() {
                toggle.classList.remove('active');
                menu.classList.remove('open');
                body.classList.remove('menu-open');
            }

            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (menu.classList.contains('open')) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            menu.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function() {
                    closeMenu();
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && menu.classList.contains('open')) {
                    closeMenu();
                }
            });

            const bgImages = document.querySelectorAll('.hero-bg-img');
            bgImages.forEach(function(img) {
                if (img.complete) {
                    img.classList.add('loaded');
                } else {
                    img.addEventListener('load', function() {
                        this.classList.add('loaded');
                    });
                    img.addEventListener('error', function() {
                        this.classList.add('loaded');
                    });
                }
            });

            const productImages = document.querySelectorAll('.card-bg img');
            productImages.forEach(function(img) {
                if (img.complete) {
                    img.classList.add('loaded');
                } else {
                    img.addEventListener('load', function() {
                        this.classList.add('loaded');
                    });
                    img.addEventListener('error', function() {
                        this.classList.add('loaded');
                    });
                }
            });

            document.querySelectorAll('a[href^="#"]').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    const id = this.getAttribute('href');
                    if (id === '#') return;
                    const target = document.querySelector(id);
                    if (target) {
                        e.preventDefault();
                        const offset = target.getBoundingClientRect().top + window.pageYOffset - 52;
                        window.scrollTo({ top: offset, behavior: 'smooth' });
                    }
                });
            });

            /* ------------------------------------------------------------
               底图明暗检测
               isDark === true  → 图偏暗，用 light-text（白字 + 玻璃按钮）
               isDark === false → 图偏亮，用 dark-text（深字 + 蓝色按钮）
               isDark === null  → 检测失败（跨域 / file:// / 加载失败），
                                  保留 HTML 里手写的 light-text / dark-text
               ------------------------------------------------------------ */
            function detectImageBrightness(imgElement, callback) {
                if (!imgElement.complete) {
                    imgElement.addEventListener('load', function onLoad() {
                        imgElement.removeEventListener('load', onLoad);
                        imgElement.removeEventListener('error', onError);
                        detectImageBrightness(imgElement, callback);
                    });
                    imgElement.addEventListener('error', function onError() {
                        imgElement.removeEventListener('load', onLoad);
                        imgElement.removeEventListener('error', onError);
                        callback(null);
                    });
                    return;
                }
                if (!imgElement.naturalWidth || !imgElement.naturalHeight) {
                    callback(null);
                    return;
                }
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const sampleSize = 100;
                    canvas.width = sampleSize;
                    canvas.height = sampleSize;
                    ctx.drawImage(imgElement, 0, 0, sampleSize, sampleSize);
                    const imageData = ctx.getImageData(0, 0, sampleSize, sampleSize);
                    const data = imageData.data;
                    let totalBrightness = 0;
                    const pixelCount = data.length / 4;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        totalBrightness += 0.299 * r + 0.587 * g + 0.114 * b;
                    }
                    const avgBrightness = totalBrightness / pixelCount;
                    callback(avgBrightness < 128);
                } catch (e) {
                    callback(null);
                }
            }

            function applyCardTextMode(card, isDark) {
                if (isDark === null) return;   // 检测失败 → 保留 HTML 手写类，避免配色被清掉
                card.classList.toggle('light-text', isDark);
                card.classList.toggle('dark-text', !isDark);
            }

            const productCards = document.querySelectorAll('.product-card');
            productCards.forEach(function(card) {
                const cardImg = card.querySelector('.card-bg img');
                if (!cardImg) return;
                detectImageBrightness(cardImg, function(isDark) {
                    applyCardTextMode(card, isDark);
                });
            });

            const SIZE_CONFIG = {
                baseHeight: 800,
                minScale: 0.55,
                maxScale: 1.40,
                title: { base: 24, min: 14, max: 40 },
                sub: { base: 14, min: 10, max: 22 },
                btnFont: { base: 12, min: 9, max: 16 },
                btnPadV: { base: 6, min: 3, max: 10 },
                btnPadH: { base: 18, min: 10, max: 30 },
                heroPadTop: { base: 60, min: 36, max: 84 },
            };

            let resizeTimer = null;

            function updateSizes() {
                const vh = window.innerHeight;
                const scale = Math.max(
                    SIZE_CONFIG.minScale,
                    Math.min(SIZE_CONFIG.maxScale, vh / SIZE_CONFIG.baseHeight)
                );

                function calcSize(config) {
                    const raw = config.base * scale;
                    return Math.round(Math.max(config.min, Math.min(config.max, raw)));
                }

                const titleSize = calcSize(SIZE_CONFIG.title);
                const subSize = calcSize(SIZE_CONFIG.sub);
                const btnFontSize = calcSize(SIZE_CONFIG.btnFont);
                const btnPadV = calcSize(SIZE_CONFIG.btnPadV);
                const btnPadH = calcSize(SIZE_CONFIG.btnPadH);
                const heroPadTop = calcSize(SIZE_CONFIG.heroPadTop);

                const root = document.documentElement;
                root.style.setProperty('--title-size', titleSize + 'px');
                root.style.setProperty('--sub-size', subSize + 'px');
                root.style.setProperty('--btn-font-size', btnFontSize + 'px');
                root.style.setProperty('--btn-padding', btnPadV + 'px ' + btnPadH + 'px');
                root.style.setProperty('--hero-padding-top', heroPadTop + 'px');
            }

            updateSizes();

            window.addEventListener('resize', function() {
                if (resizeTimer) {
                    cancelAnimationFrame(resizeTimer);
                }
                resizeTimer = requestAnimationFrame(function() {
                    updateSizes();
                    resizeTimer = null;
                });
            });

            bgImages.forEach(function(img) {
                img.addEventListener('load', function() {
                    setTimeout(updateSizes, 200);
                });
            });

            window.addEventListener('load', function() {
                setTimeout(updateSizes, 300);
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(updateSizes, 400);
            });

            console.log('%c 🐧 Scooty Penguin · 首页 ', 'background:#1d1d1f;color:#f5f5f7;font-size:18px;font-weight:300;padding:10px 20px;border-radius:4px;letter-spacing:1px;');
            console.log('%c 🖼️ 导航栏 Logo: Web 端使用 logo-web.png，移动端使用 logo.png', 'font-size:13px;color:#6e6e73;');
            console.log('%c 📁 字体: fonts/SC.ttf ｜ 图片: images/ (含 logo-web.png, logo.png, ss.png, shop.png)', 'font-size:13px;color:#6e6e73;');

        })();
    </script>
